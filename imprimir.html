<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Pedido - Pastelaria dos Gordelas</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Courier New', Courier, monospace;
        }
        
        body { 
            background: #2a2a2a; 
            padding: 15px 0 30px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .aviso-topo {
            width: 58mm;
            max-width: 58mm;
            background: #FFC107;
            color: #000;
            padding: 6px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        
        /* ===== BOBINA DE PAPEL (58mm total, simula a bobina) ===== */
        .papel {
            width: 58mm;
            max-width: 58mm;
            background: #fff;
            padding: 4mm 4mm 5mm 4mm;  /* margem interna de 4mm nas laterais */
            box-shadow: 0 6px 25px rgba(0,0,0,0.5);
            border-radius: 2px;
        }
        
        /* ===== CUPOM (conteúdo interno — usa só os ~50mm úteis) ===== */
        .cupom {
            font-size: 10px;
            line-height: 1.3;
            color: #000;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        /* ===== CABEÇALHO ===== */
        .cabecalho { 
            text-align: center; 
            font-weight: bold; 
            margin-bottom: 3px;
        }
        .cabecalho h1 { 
            font-size: 12px; 
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .cabecalho .sub { 
            font-size: 9px; 
            font-weight: normal;
            margin-top: 1px;
        }
        
        /* ===== LINHAS DIVISÓRIAS ===== */
        .linha { 
            border-top: 1px dashed #000; 
            margin: 4px 0;
        }
        
        /* ===== CAMPOS EM DUPLA (label + valor na mesma linha) ===== */
        .dupla {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            font-size: 10px;
            margin: 1px 0;
            line-height: 1.3;
        }
        .dupla > span:first-child { 
            flex-shrink: 0;
            font-weight: bold;
        }
        .dupla > span:last-child { 
            text-align: right;
            word-break: break-word;
            overflow-wrap: anywhere;
            flex: 1;
        }
        
        /* ===== CAMPOS LONGO (label + valor que pode quebrar linha) ===== */
        .campo-longo {
            font-size: 10px;
            margin: 2px 0;
            line-height: 1.25;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }
        .campo-longo .label { 
            font-weight: bold;
        }
        
        /* ===== TÍTULOS DE SEÇÃO ===== */
        .secao-titulo { 
            font-weight: bold; 
            font-size: 10px; 
            margin: 3px 0;
        }
        
        /* ===== ITENS DO PEDIDO ===== */
        .item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 3px;
            font-size: 10px;
            margin: 2px 0;
            line-height: 1.25;
        }
        .item .nome {
            flex: 1;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            min-width: 0;
        }
        .item .valor {
            flex-shrink: 0;
            text-align: right;
            white-space: nowrap;
            font-weight: bold;
        }
        
        /* ===== TOTAL ===== */
        .total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 12px;
            border-top: 2px solid #000;
            padding-top: 3px;
            margin-top: 4px;
        }
        
        /* ===== OBSERVAÇÃO ===== */
        .obs {
            font-size: 9px;
            font-style: italic;
            margin-top: 5px;
            padding: 3px 4px;
            border: 1px solid #000;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            line-height: 1.25;
        }
        
        /* ===== RODAPÉ ===== */
        .rodape {
            text-align: center;
            font-size: 9px;
            margin-top: 6px;
            line-height: 1.3;
        }
        
        /* ===== BOTÕES ===== */
        .botoes {
            width: 58mm;
            max-width: 58mm;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .btn-print {
            padding: 12px;
            background: #FFC107;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            color: #000;
        }
        .btn-print:active { background: #E0A800; }
        .btn-voltar {
            padding: 10px;
            background: transparent;
            border: 2px solid #666;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
        }
        
        /* ===== IMPRESSÃO ===== */
        @media print {
            body { 
                background: #fff; 
                padding: 0; 
                display: block;
            }
            .aviso-topo, .botoes { display: none !important; }
            .papel {
                width: 58mm;
                max-width: 58mm;
                box-shadow: none;
                border-radius: 0;
                padding: 2mm 4mm 3mm 4mm;
                margin: 0;
            }
            .cupom {
                /* Em térmica, remove o último rodapé extra se quiser economizar papel */
            }
            @page { 
                size: 58mm auto; 
                margin: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="aviso-topo">📄 Simulação da bobina 58mm</div>

    <!-- Bobina (papel branco de 58mm) -->
    <div class="papel">
        <!-- Cupom (conteúdo com margem interna) -->
        <div class="cupom" id="cupom"></div>
    </div>
    
    <div class="botoes">
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Agora</button>
        <button class="btn-voltar" onclick="window.close()">Fechar</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const id = params.get('id') || '-';
        const nome = params.get('nome') || '-';
        const telefone = params.get('tel') || '-';
        const modalidade = (params.get('mod') || '-').replace(/[🛵🏃🍽️]/g, '').trim();
        const endereco = params.get('end') || '';
        const bairro = params.get('bai') || '';
        const itens = (params.get('itens') || '').split('|').filter(x => x);
        const subtotal = params.get('sub') || '0,00';
        const taxa = params.get('taxa') || '0,00';
        const total = params.get('tot') || '0,00';
        const pagamento = params.get('pag') || '-';
        const obs = params.get('obs') || '';
        
        const dataHora = new Date().toLocaleString('pt-BR', { 
            dateStyle: 'short', 
            timeStyle: 'short' 
        });

        // ===== ENDEREÇO (só se for entrega) =====
        let enderecoHtml = '';
        if (modalidade.toLowerCase().includes('entrega') && endereco) {
            enderecoHtml = `
                <div class="linha"></div>
                <div class="campo-longo"><span class="label">Endereço:</span> ${endereco}</div>
                <div class="campo-longo"><span class="label">Bairro:</span> ${bairro}</div>
            `;
        }

        // ===== ITENS =====
        let itensHtml = itens.map(item => {
            const partes = item.split(':');
            const qtdNome = partes[0];
            const valor = partes[1] || '0,00';
            return `<div class="item"><span class="nome">${qtdNome}</span><span class="valor">R$ ${valor}</span></div>`;
        }).join('');

        // ===== TAXA (só se > 0) =====
        let taxaHtml = '';
        if (parseFloat(taxa.replace(',', '.')) > 0) {
            taxaHtml = `<div class="dupla"><span>Taxa de Entrega</span><span>R$ ${taxa}</span></div>`;
        }

        // ===== OBSERVAÇÃO =====
        let obsHtml = obs ? `<div class="obs">Obs: ${obs}</div>` : '';

        // ===== MONTAGEM DO CUPOM =====
        document.getElementById('cupom').innerHTML = `
            <div class="cabecalho">
                <h1>PASTELARIA DOS<br>GORDELAS</h1>
                <div class="sub">Mogi das Cruzes - SP</div>
            </div>
            
            <div class="linha"></div>
            
            <div class="dupla"><span>Pedido:</span><span>${id}</span></div>
            <div class="dupla"><span>Data:</span><span>${dataHora}</span></div>
            
            <div class="linha"></div>
            
            <div class="campo-longo"><span class="label">Cliente:</span> ${nome}</div>
            <div class="campo-longo"><span class="label">Telefone:</span> ${telefone}</div>
            <div class="campo-longo"><span class="label">Modalidade:</span> ${modalidade}</div>
            
            ${enderecoHtml}
            
            <div class="linha"></div>
            
            <div class="secao-titulo">ITENS:</div>
            ${itensHtml}
            
            <div class="linha"></div>
            
            <div class="dupla"><span>Subtotal</span><span>R$ ${subtotal}</span></div>
            ${taxaHtml}
            <div class="total"><span>TOTAL</span><span>R$ ${total}</span></div>
            
            <div class="linha"></div>
            
            <div class="campo-longo"><span class="label">Pagamento:</span> ${pagamento}</div>
            
            ${obsHtml}
            
            <div class="rodape">
                Obrigado pela preferência!<br>
                Frito na hora, sempre crocante!
            </div>
        `;
    </script>
</body>
</html>
