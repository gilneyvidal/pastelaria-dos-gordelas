<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelaria dos Gordelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- 🖼️ ESPAÇO PARA O LOGO: Quando criar sua imagem, salve como logo.png na pasta public/images/ e ela aparecerá aqui -->
        <img src="public/images/logo.png" alt="Pastelaria dos Gordelas" class="logo" onerror="this.style.display='none'; document.getElementById('logo-texto').style.display='block'">
        
        <div id="logo-texto" style="display:none;">
            <h1>PASTELARIA DOS GORDELAS</h1>
            <p>O melhor pastel, do seu jeito!</p>
        </div>
    </header>

    <nav id="categorias">
        <!-- Abas geradas pelo JS -->
    </nav>

    <main id="cardapio">
        <!-- Produtos gerados pelo JS -->
    </main>

    <!-- Carrinho Fixo -->
    <div id="carrinho-fixo" class="carrinho-fechado">
        <div class="carrinho-header" onclick="toggleCarrinho()">
            <span>🛒 Meu Pedido (<span id="qtd-itens">0</span>)</span>
            <span>Total: R$ <span id="total-carrinho">0,00</span></span>
        </div>
        <div class="carrinho-conteudo" id="itens-carrinho">
            <!-- Itens do carrinho -->
        </div>
        <button id="btn-finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
    </div>

    <!-- Modal Monte o Seu -->
    <div id="modal-monter" class="modal-escondido">
        <div class="modal-conteudo">
            <h2>Escolha até 5 Sabores</h2>
            <p id="contador-sabores" class="contador">0 / 5</p>
            <div id="lista-opcoes">
                <!-- Opções -->
            </div>
            <button class="btn-adicionar-modal" onclick="adicionarMonteAoCarrinho()">Adicionar ao Carrinho</button>
            <button class="btn-fechar-modal" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
