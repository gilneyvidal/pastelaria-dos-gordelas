<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelaria dos Gordelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="public/images/logo.png" alt="Pastelaria dos Gordelas" class="logo" onerror="this.style.display='none'; document.getElementById('logo-texto').style.display='block'">
        <div id="logo-texto" style="display:none;">
            <h1>PASTELARIA DOS GORDELAS</h1>
            <p>O melhor pastel, do seu jeito!</p>
        </div>
    </header>

    <nav id="categorias"></nav>

    <main id="cardapio"></main>

    <div id="carrinho-fixo" class="carrinho-fechado">
        <div class="carrinho-header" onclick="toggleCarrinho()">
            <span>🛒 Meu Pedido (<span id="qtd-itens">0</span>)</span>
            <span>Total: R$ <span id="total-carrinho">0,00</span></span>
        </div>
        <div class="carrinho-conteudo" id="itens-carrinho"></div>
        <button id="btn-finalizar" onclick="abrirCheckout()">Finalizar Pedido</button>
    </div>

    <div id="modal-monter" class="modal-escondido">
        <div class="modal-conteudo">
            <h2>Escolha até 5 Sabores</h2>
            <p id="contador-sabores" class="contador">0 / 5</p>
            <div id="lista-opcoes"></div>
            <button class="btn-primario" onclick="adicionarMonteAoCarrinho()">Adicionar ao Carrinho</button>
            <button class="btn-secundario" onclick="fecharModal('modal-monter')">Cancelar</button>
        </div>
    </div>

    <div id="modal-checkout" class="modal-escondido">
        <div class="modal-conteudo">
            <h2>Finalizar Pedido</h2>
            
            <label class="campo">
                <span>Seu Nome *</span>
                <input type="text" id="cli-nome" placeholder="Digite seu nome" required>
            </label>

            <label class="campo">
                <span>Telefone/WhatsApp *</span>
                <input type="tel" id="cli-telefone" placeholder="(11) 99999-9999" required>
            </label>

            <div class="campo">
                <span>Como deseja receber? *</span>
                <div class="opcoes-radio">
                    <label><input type="radio" name="modalidade" value="entrega" checked onchange="toggleEndereco()"> 🛵 Entrega</label>
                    <label><input type="radio" name="modalidade" value="retirada" onchange="toggleEndereco()"> 🏃 Retirada</label>
                    <label><input type="radio" name="modalidade" value="local" onchange="toggleEndereco()"> 🍽️ Consumo no Local</label>
                </div>
            </div>

            <div id="campos-endereco">
                <label class="campo">
                    <span>Endereço (Rua e Número) *</span>
                    <input type="text" id="cli-endereco" placeholder="Rua Exemplo, 123">
                </label>
                <label class="campo">
                    <span>Bairro *</span>
                    <select id="cli-bairro" onchange="calcularTaxa()">
                        <option value="">Selecione o bairro</option>
                    </select>
                </label>
                <label class="campo">
                    <span>Complemento</span>
                    <input type="text" id="cli-complemento" placeholder="Apto, bloco, referência...">
                </label>
            </div>

            <div class="campo">
                <span>Forma de Pagamento *</span>
                <div class="opcoes-radio">
                    <label><input type="radio" name="pagamento" value="Pix" checked onchange="toggleSubPagamento()"> 💠 Pix</label>
                    <label><input type="radio" name="pagamento" value="Cartão" onchange="toggleSubPagamento()"> 💳 Cartão</label>
                    <label><input type="radio" name="pagamento" value="Dinheiro" onchange="toggleSubPagamento()"> 💵 Dinheiro</label>
                </div>
            </div>

            <!-- Sub-opções do Cartão -->
            <div id="sub-pagamento-cartao" class="sub-opcoes" style="display:none;">
                <span class="sub-label">Tipo de Cartão:</span>
                <div class="opcoes-radio">
                    <label><input type="radio" name="tipo-cartao" value="Débito" checked> Débito</label>
                    <label><input type="radio" name="tipo-cartao" value="Crédito"> Crédito</label>
                </div>
            </div>

            <!-- Sub-opção do Dinheiro (troco) -->
            <div id="sub-pagamento-dinheiro" class="sub-opcoes" style="display:none;">
                <label class="campo">
                    <span>Precisa de troco? Para quanto?</span>
                    <input type="text" id="cli-troco" placeholder="Ex: 100,00 (deixe vazio se não precisar)">
                </label>
            </div>

            <label class="campo">
                <span>Observações</span>
                <textarea id="cli-obs" placeholder="Alguma observação sobre o pedido?"></textarea>
            </label>

            <div class="resumo-checkout">
                <div>Subtotal: <strong>R$ <span id="resumo-subtotal">0,00</span></strong></div>
                <div id="linha-taxa" style="display:none;">Taxa de Entrega: <strong>R$ <span id="resumo-taxa">0,00</span></strong></div>
                <div class="total-final">Total: <strong>R$ <span id="resumo-total">0,00</span></strong></div>
            </div>

            <button class="btn-primario" onclick="enviarPedidoWhatsApp()">Enviar Pedido no WhatsApp</button>
            <button class="btn-secundario" onclick="fecharModal('modal-checkout')">Voltar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
