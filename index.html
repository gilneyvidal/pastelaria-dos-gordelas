<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelaria dos Gordelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-placeholder">
            <h1>PASTELARIA DOS GORDELAS</h1>
            <p>O melhor pastel do seu jeito!</p>
        </div>
    </header>

    <nav id="categorias">
        <!-- As abas serão geradas pelo JavaScript -->
    </nav>

    <main id="cardapio">
        <!-- Os produtos serão listados aqui pelo JavaScript -->
    </main>

    <div id="carrinho-fixo" class="carrinho-fechado">
        <div class="carrinho-header" onclick="toggleCarrinho()">
            <span>🛒 Meu Pedido (<span id="qtd-itens">0</span>)</span>
            <span>Total: R$ <span id="total-carrinho">0,00</span></span>
        </div>
        <div class="carrinho-conteudo" id="itens-carrinho">
            <!-- Itens do carrinho aparecerão aqui -->
        </div>
        <button id="btn-finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
    </div>

    <!-- Modal para o "Monte o Seu" -->
    <div id="modal-monter" class="modal-escondido">
        <div class="modal-conteudo">
            <h2>Escolha até 5 Sabores</h2>
            <p id="contador-sabores">0 / 5</p>
            <div id="lista-opcoes">
                <!-- Opções serão geradas pelo JavaScript -->
            </div>
            <button onclick="adicionarMonteAoCarrinho()">Adicionar ao Carrinho</button>
            <button class="btn-fechar" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
